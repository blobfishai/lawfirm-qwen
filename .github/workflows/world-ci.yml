# M0.3 — every world change runs the complete local trust chain.
name: world-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORLD: world/blobfish/world-v16.json
  BASE: http://127.0.0.1:8974
  HARBOR_VERSION: 0.21.0
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deterministic-trust-chain:
    name: oracle, discrimination, fixtures, badbank
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned conformance validator
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r tools/conformance/requirements.txt

      - name: Validate scripts
        run: |
          python3 -m py_compile \
            world/local/server.py \
            world/local/evidence.py \
            world/local/product_workflows.py \
            world/local/paging.py \
            world/local/query_dsl.py \
            world/local/discriminate.py \
            world/migrate/gen1_to_v16.py \
            world/migrate/verifier.py \
            world/ingest/lab_ingest.py \
            world/manifest/normalization.py \
            world/manifest/render.py \
            world/manifest/roundtrip.py \
            world/manifest/compile_assertions.py \
            world/port/lab_determinize.py \
            world/corpus/build_ch_fts.py \
            world/v17/build.py \
            world/v17/ground_existing.py \
            world/v17/practice.py \
            world/v17/verifiers.py \
            world/v18/build.py \
            world/v18/verifiers.py \
            world/v19/build.py \
            world/v19/verifiers.py \
            world/local/precorrection.py \
            tools/check_atomic_seed.py \
            tools/check_lab_ingest.py \
            tools/check_harbor_file_lane.py \
            tools/check_lab_port.py \
            tools/check_lab_extractor_parity.py \
            tools/check_external_evidence.py \
            tools/check_ch_fts.py \
            tools/check_retrieval_grading.py \
            tools/check_practice_import.py \
            tools/check_existing_grounding.py \
            tools/check_v17_import.py \
            tools/promote_lab_determinization.py \
            tools/report_lab_determinization.py \
            tools/sample_lab_determinization.py \
            tools/check_v18_workflows.py \
            tools/check_v19_multistep.py \
            tools/replay_v19_capstones.py \
            tools/check_m3_contracts.py \
            tools/check_pagination.py \
            tools/check_query_dsl.py \
            tools/check_auth_errors.py \
            tools/check_product_surface.py \
            tools/conformance/run.py \
            tools/conformance/check_fixtures.py \
            tools/conformance/sync_specs.py \
            tools/check_discrimination.py \
            tools/check_harbor_result.py \
            tools/check_harbor_multistep.py
          node --check world/expansion/discrimination-report.mjs
          node --check sim/compare-v16-boundary.mjs
          node --check sim/run-leaderboard.mjs
          node --check sim/run-simulation.mjs
          python3 world/migrate/gen1_to_v16.py --check
          python3 tools/check_product_surface.py
          node sim/compare-v16-boundary.mjs
          python3 tools/check_atomic_seed.py
          python3 tools/check_lab_ingest.py
          python3 tools/check_harbor_file_lane.py
          python3 tools/check_lab_port.py
          python3 tools/check_lab_extractor_parity.py --check
          python3 tools/check_external_evidence.py
          python3 tools/check_ch_fts.py
          python3 world/corpus/build_ch_fts.py --check
          python3 tools/check_retrieval_grading.py
          python3 tools/check_practice_import.py
          python3 tools/check_existing_grounding.py
          python3 tools/check_v17_import.py
          python3 tools/report_lab_determinization.py --check
          python3 tools/sample_lab_determinization.py --check
          node world/expansion/parity-audit.mjs
          git diff --exit-code -- docs/PARITY.md
          python3 tools/check_m3_contracts.py
          python3 world/v18/build.py
          git diff --exit-code -- world/blobfish/world-v18.json world/v18/build-report.json
          python3 tools/check_v18_workflows.py
          python3 world/v19/build.py
          git diff --exit-code -- world/blobfish/world-v19.json world/v19/build-report.json
          python3 tools/check_v19_multistep.py
          python3 tools/check_pagination.py
          python3 tools/check_query_dsl.py
          python3 -m unittest discover -s world/manifest/tests -v
          python3 -m unittest discover -s world/port/tests -v
          python3 -m unittest discover -s world/local/tests -v
          python3 tools/conformance/sync_specs.py --check
          python3 tools/conformance/check_fixtures.py
          python3 tools/conformance/run.py --check

      - name: Run deterministic trust chain
        run: |
          set -euo pipefail
          world_log="$RUNNER_TEMP/world.log"
          python3 world/local/server.py --port 8974 --world "$WORLD" \
            --v2-contracts mcp/v3/contracts >"$world_log" 2>&1 &
          world_pid=$!
          cleanup() {
            kill "$world_pid" 2>/dev/null || true
            wait "$world_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent "$BASE/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            sed -n '1,200p' "$world_log"
            exit 1
          fi

          python3 tools/conformance/live.py --base "$BASE" --check
          python3 tools/check_auth_errors.py --base "$BASE" --world "$WORLD"
          python3 world/local/oracle.py --base "$BASE" --world "$WORLD" \
            --out data/oracle-v16.json
          python3 world/local/discriminate.py --base "$BASE" --world "$WORLD" \
            --out data/discrimination-v16.json --report-only
          node world/expansion/discrimination-report.mjs \
            --sweep data/discrimination-v16.json \
            --world "$WORLD" \
            --docs-out docs/DISCRIMINATION-v16.md \
            --data-out data/discrimination-v16-classified.json
          python3 tools/check_fixtures.py --base "$BASE"
          BLOBFISH_LOCAL_BASE="$BASE" node mcp/test-multi-server.mjs

          cleanup
          trap - EXIT
          python3 tools/check_gates.py --world "$WORLD" --port 8975

      - name: Require committed audit artifacts to be current
        run: |
          git diff --exit-code -- \
            data/oracle-v16.json \
            data/discrimination-v16.json \
            data/discrimination-v16-classified.json \
            docs/DISCRIMINATION-v16.md \
            data/migration/v16-boundary-shift.json \
            docs/V16-BOUNDARY-SHIFT.md

  harbor-smoke:
    name: Harbor oracle and no-op smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate smoke tasks
        run: |
          python3 harbor/generate.py \
            --world "$WORLD" \
            --out dist/harbor-ci \
            --tasks task_003,task_v3_001,task_194 \
            --image-tag legal-agent-sim-world:ci

      - name: Build cached world image
        run: |
          solve_token_hash="$(python3 -c 'import hashlib,pathlib; print(hashlib.sha256(pathlib.Path("dist/harbor-ci/world-image/solve-token.txt").read_text().strip().encode()).hexdigest())')"
          docker buildx build --load \
            --tag legal-agent-sim-world:ci \
            --build-arg "ORACLE_PROOF_SHA256=$solve_token_hash" \
            --cache-from type=gha,scope=world-v16 \
            --cache-to type=gha,mode=max,scope=world-v16 \
            dist/harbor-ci/world-image

      - name: Oracle must pass all three tasks
        run: |
          uvx --from "harbor==$HARBOR_VERSION" harbor run \
            --path dist/harbor-ci/tasks \
            --agent oracle \
            --jobs-dir jobs/world-ci \
            --job-name m0-harbor-oracle \
            --n-concurrent 3 --quiet --yes
          python3 tools/check_harbor_result.py \
            --job jobs/world-ci/m0-harbor-oracle \
            --tasks task_003 task_v3_001 task_194 \
            --reward 1 --passed 1

      - name: No-op must fail all three tasks
        run: |
          uvx --from "harbor==$HARBOR_VERSION" harbor run \
            --path dist/harbor-ci/tasks \
            --agent nop \
            --jobs-dir jobs/world-ci \
            --job-name m0-harbor-nop \
            --n-concurrent 3 --quiet --yes
          python3 tools/check_harbor_result.py \
            --job jobs/world-ci/m0-harbor-nop \
            --tasks task_003 task_v3_001 task_194 \
            --reward 0 --passed 0
